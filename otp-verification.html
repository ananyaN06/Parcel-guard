
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification | Smart Parcel Protection</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="otp-page">

    <header class="navbar">
        <div class="logo">
            <div class="logo-icon">⬡</div>
            <span>Parcel<span class="blue">Guard</span></span>
        </div>
        <a href="security-analysis.html" class="nav-login">← Back to Security</a>
    </header>

    <main class="otp-container">

        <section class="otp-card">

            <div class="otp-icon">⌑</div>

            <span class="section-tag">SECURE COLLECTION</span>
            <h1>Verify Your <span>Identity</span></h1>

            <p class="otp-description">
                Enter the six-digit OTP provided to the receiver
                to securely unlock the parcel locker.
            </p>

            <div class="otp-parcel-info">
                <span>TRACKING ID</span>
                <strong>PARCEL-DEMO-001</strong>
            </div>

            <form id="otpForm">

                <label for="otpInput">Enter 6-Digit OTP</label>

                <input
                    type="text"
                    id="otpInput"
                    maxlength="6"
                    inputmode="numeric"
                    pattern="[0-9]{6}"
                    placeholder="• • • • • •"
                    required
                >

                <button type="submit" class="otp-submit">
                    Verify OTP →
                </button>

                <p id="otpMessage" class="otp-message"></p>

            </form>

            <div class="otp-security-note">
                <span>◇</span>
                Your parcel is protected by secure OTP verification.
            </div>

        </section>

    </main>

    <script src="js/otp.js"></script>
</body>
</html>
